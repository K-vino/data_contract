<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dashboard-container {
      background: #fff;
      padding: 40px 60px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 90%;
      max-width: 400px;
    }

    .dashboard-container h1 {
      margin-bottom: 30px;
      font-size: 28px;
      color: #333;
    }

    .button {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 15px 25px;
      margin: 15px 0;
      border-radius: 12px;
      font-size: 18px;
      width: 100%;
      cursor: pointer;
      transition: 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .button:hover {
      background: #0056b3;
      transform: translateY(-2px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
    }

    .button span {
      margin-left: 10px;
    }

    @media (max-width: 480px) {
      .dashboard-container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <h1> Admin Dashboard</h1>
    <button class="button" onclick="location.href='admin_dashboard.html'">
       <span>Vote Result</span>
    </button>
    <button class="button" onclick="location.href='admin.html'">
      ️ <span>Voting System Complaints</span>
    </button>
  </div>

</body>
</html>
